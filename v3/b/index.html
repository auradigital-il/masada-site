<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700&family=Cormorant+Garamond:wght@500;700&family=Montserrat:wght@200;300;500&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="../../media/roei-ai-poster.jpg">

<style>
:root{--r:6px;--hw1:700;--hf:var(--serif);--bg:#08100d;--panel:#0e1813;--ink3:#15221b;--fg:#efe9dc;--mu:rgba(239,233,220,.68);--ln:rgba(212,176,106,.28);--acc:#d4b06a;--acc2:#f0dca6;--acc3:#a8823f;--acc-fg:#1a1306;
  --serif:'Frank Ruhl Libre',Georgia,serif}
html[lang=en]{--serif:'Cormorant Garamond',Georgia,serif}
body{font-family:'Heebo',system-ui,sans-serif;font-weight:300;background:var(--bg);color:var(--fg);line-height:1.7;font-size:18px;-webkit-font-smoothing:antialiased;overflow-x:clip}
.cap{font:500 11.5px/1.4 'Montserrat',sans-serif;letter-spacing:.32em;color:var(--acc);direction:ltr;unicode-bidi:isolate;display:inline-block}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 15px/1 'Heebo',sans-serif;border:0;border-radius:999px;padding:15px 26px;color:var(--acc-fg);background:linear-gradient(180deg,var(--acc2),var(--acc) 60%,#c29a52);cursor:pointer}
.btn.gh{background:transparent;color:var(--fg);border:1px solid var(--ln)}
.top{z-index:65}

/* עמוד ראשי: רועי הולך אל הגולש */
.hero{position:relative;height:100vh;height:100svh;overflow:hidden}
.hero video,.hero .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:35% 30%}
.hero .shade{position:absolute;inset:0;background:linear-gradient(270deg,rgba(8,16,13,1) 0%,rgba(8,16,13,.94) 25%,rgba(8,16,13,.5) 42%,rgba(8,16,13,0) 60%),linear-gradient(transparent 72%,rgba(8,16,13,.85))}
html[dir=ltr] .hero .shade{background:linear-gradient(90deg,rgba(8,16,13,1) 0%,rgba(8,16,13,.94) 25%,rgba(8,16,13,.5) 42%,rgba(8,16,13,0) 60%),linear-gradient(transparent 72%,rgba(8,16,13,.85))}
@media(min-width:901px){.hero video,.hero .poster{transform:translateX(-20%);-webkit-mask-image:linear-gradient(to left,transparent 18%,#000 45%);mask-image:linear-gradient(to left,transparent 18%,#000 45%)}html[dir=ltr] .hero video,html[dir=ltr] .hero .poster{transform:translateX(20%);-webkit-mask-image:linear-gradient(to right,transparent 18%,#000 45%);mask-image:linear-gradient(to right,transparent 18%,#000 45%)}}
.hero .txt{position:absolute;inset-block:0;inset-inline-start:0;width:min(46vw,680px);display:flex;flex-direction:column;justify-content:center;padding:90px 0 130px;padding-inline-start:7vw}
.hero h1{line-height:1;margin-top:4px}
.hero h1 b{font-weight:900;background:linear-gradient(180deg,var(--acc2),var(--acc) 55%,var(--acc3));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .role{font-family:var(--serif);font-weight:500;font-size:clamp(22px,2vw,30px);line-height:1.3;margin-top:20px}
.hero .line{color:var(--mu);font-size:clamp(15px,1.2vw,18px);margin-top:12px}
.hero .sig{font-size:clamp(92px,9vw,160px);margin-inline-start:-.25em;font-weight:400}
.hero .txt>*{opacity:0;transform:translateY(28px);transition:opacity 1.1s,transform 1.1s cubic-bezier(.2,.8,.2,1)}
.ready .hero .txt>*{opacity:1;transform:none}
.ready .hero .txt>*:nth-child(2){transition-delay:.12s}.ready .hero .txt>*:nth-child(3){transition-delay:.24s}.ready .hero .txt>*:nth-child(4){transition-delay:.36s}.ready .hero .txt>*:nth-child(2){transition-delay:.2s}.ready .hero .txt>*:nth-child(5){transition-delay:.6s}
.more{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.more a{font-size:15px;color:var(--acc2);border-bottom:1px solid var(--ln);padding-bottom:3px;transition:border-color .3s}
.more a:hover{border-color:var(--acc)}
.more a::after{content:" ←"}html[dir=ltr] .more a::after{content:" →"}
.ai-note{position:absolute;top:84px;inset-inline-end:28px;max-width:250px;padding:12px 16px;border:1px solid var(--ln);border-radius:12px;background:rgba(8,16,13,.6);backdrop-filter:blur(10px);font-size:13px;line-height:1.55;color:var(--mu)}
.ai-note b{display:block;color:var(--acc2);font-size:14px}
.replay{position:absolute;bottom:110px;inset-inline-start:7vw;display:none}
@media(max-width:900px){
  .hero .shade,html[dir=ltr] .hero .shade{background:linear-gradient(transparent 30%,rgba(8,16,13,.75) 52%,rgba(8,16,13,.97) 70%)}
  .hero .txt{width:auto;inset:auto 0 0;justify-content:flex-end;align-items:center;text-align:center;padding:0 22px 146px}
  .hero .role{font-size:19px;margin-top:8px}.hero .line{font-size:14px;margin-top:4px}
  .hero .sig{font-size:min(17vw,92px);margin:0}
  .more{justify-content:center;gap:14px}.more a{font-size:14px}
  .ai-note{top:112px;bottom:auto;inset-inline-end:12px;max-width:170px;font-size:11px;padding:8px 11px}.ai-note b{font-size:12px}
}
@media(max-width:900px) and (max-height:720px){.hero .line{display:none}}
footer{border-top:1px solid var(--ln);padding:34px 20px 130px;text-align:center;font-size:13px;color:var(--mu);background:var(--panel)}
footer .socials{margin-bottom:18px}
footer .credit{margin-top:10px}

/* עמודים: נפתחים בעיגול מהכפתור שנלחץ */
.page{background:radial-gradient(1100px 700px at 80% 0%,rgba(212,176,106,.08),transparent 70%),var(--bg);clip-path:circle(0 at var(--ox,50%) var(--oy,100%));transition:clip-path .9s cubic-bezier(.7,0,.2,1),visibility 0s .9s}
.page.on{clip-path:circle(150% at var(--ox,50%) var(--oy,100%));transition:clip-path .9s cubic-bezier(.7,0,.2,1)}
.pg-head{margin-top:26px;border-bottom:1px solid var(--ln);padding-bottom:30px}
.pg-head h2{font-family:var(--serif);font-weight:900;font-size:clamp(40px,5.6vw,90px);line-height:1.04;margin-top:12px;outline:none}
.pg-head h2 b{background:linear-gradient(180deg,var(--acc2),var(--acc) 55%,var(--acc3));-webkit-background-clip:text;background-clip:text;color:transparent}
.pg-head .sub{color:var(--mu);margin-top:12px}
.badge{display:inline-block;margin-top:16px;font-size:13px;padding:6px 14px;border-radius:999px;border:1px dashed var(--ln);color:var(--acc2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,80px);margin-top:46px;align-items:start}
.body p{color:var(--mu);margin-top:14px}
.body p b{color:var(--fg);font-weight:500}
.body .lead{font-family:var(--serif);font-weight:700;font-size:clamp(24px,2.3vw,34px);color:var(--fg);line-height:1.3;margin-top:0}
.body h3{font-family:var(--serif);font-weight:700;font-size:28px;color:var(--acc2);margin-top:40px}
.body h3:first-child{margin-top:0}
.body .q{font-family:var(--serif);font-weight:700;font-size:clamp(24px,2.4vw,34px);color:var(--fg);line-height:1.3;margin-top:34px}
.body .q b,.body .q2 b{color:var(--acc2)}
.body .q2{font-family:var(--serif);font-size:22px;color:var(--fg);margin-top:14px}
.pills{list-style:none;margin:24px 0 18px}
.pills li{display:flex;align-items:center;gap:14px;font-family:var(--serif);font-weight:700;font-size:clamp(22px,2vw,30px);padding:8px 0;border-bottom:1px solid var(--ln)}
.pills li::before{content:"✓";display:grid;place-items:center;width:32px;height:32px;flex:none;border:1px solid var(--acc);border-radius:50%;font:600 14px/1 'Heebo';color:var(--acc)}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.media{border-radius:6px;overflow:hidden;position:relative;box-shadow:0 40px 120px rgba(0,0,0,.55)}
.media::after{content:"";position:absolute;inset:0;border:1px solid var(--ln);border-radius:6px;pointer-events:none}
.media video,.media img{width:100%;height:100%;object-fit:cover}
#p-broker .media{aspect-ratio:4/5;position:sticky;top:100px}
#p-broker .media video{object-position:35% 50%}
#p-renew .media{aspect-ratio:16/10;position:sticky;top:100px}
.m26img{aspect-ratio:1408/768}
.media .tag{position:absolute;top:14px;inset-inline-start:14px;z-index:2;font-size:12px;padding:7px 12px;border-radius:999px;background:rgba(8,16,13,.75);color:var(--acc2)}
.zero{margin-top:30px;display:flex;gap:20px;align-items:center;padding:18px 22px;border:1px solid var(--acc);border-radius:6px;background:rgba(212,176,106,.08)}
.zero .z{font-family:var(--serif);font-weight:900;font-size:clamp(46px,5vw,72px);line-height:1;white-space:nowrap}
.zero b{display:block;font-size:20px;color:var(--fg);font-weight:500}
.zero span:not(.z){display:block;color:var(--mu);font-size:15px;margin-top:4px}
.steps{list-style:none;counter-reset:s;margin-top:16px}
.steps li{counter-increment:s;display:grid;grid-template-columns:52px 1fr;padding:12px 0;border-top:1px solid var(--ln)}
.steps li::before{content:counter(s,decimal-leading-zero);font-family:var(--serif);font-weight:900;font-size:24px;color:var(--acc)}
.formbox{margin-top:64px;display:grid;grid-template-columns:.8fr 1.2fr;gap:40px;align-items:center;padding:clamp(24px,4vw,48px);border:1px solid var(--ln);border-radius:6px;background:var(--panel)}
.formbox .fh{font-family:var(--serif);font-weight:700;font-size:clamp(30px,3vw,46px);line-height:1.1;margin-top:10px}
.formbox .fh b{color:var(--acc2)}
.formbox p{color:var(--mu);margin-top:8px}
.formbox.small{grid-template-columns:1fr;gap:16px;margin-top:24px}
.formbox.small .fh{font-size:28px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:44px}
.card{display:flex;flex-direction:column;gap:8px;border:1px solid var(--ln);border-radius:6px;overflow:hidden;background:var(--panel);padding-bottom:22px;transition:transform .3s;position:relative}
.card:hover{transform:translateY(-4px)}
.card img{aspect-ratio:16/10;object-fit:cover;width:100%;margin-bottom:10px}
.card .k,.card h3,.card .go{padding-inline:22px}
.card .k{font-size:13px;color:var(--acc)}
.card h3{font-family:var(--serif);font-weight:700;font-size:23px;line-height:1.3}
.card .go{color:var(--acc2);font-size:14px;margin-top:auto}
.card.soon{opacity:.6}.card.soon:hover{transform:none}
.cards.press .card{padding-top:26px;min-height:220px}
.tagx{position:absolute;top:14px;inset-inline-end:14px;font-size:11px;padding:4px 10px;border-radius:999px;border:1px dashed var(--ln);color:var(--mu)}
@media(max-width:900px){
  .grid2,.formbox{grid-template-columns:1fr}
  #p-broker .media,#p-renew .media{position:relative;top:0}
  #p-broker .media{aspect-ratio:4/3}
  .cards{grid-template-columns:1fr}
  .zero{padding:14px 16px}
}
.hs .hstats b{font-family:var(--serif);font-weight:900}
.hs{padding-top:70px}
.hs .ht h2 b{font-weight:900}
</style>
</head>

<script>
// רועי הולך אל הגולש פעם אחת, ונעצר קרוב. בטלפון המסגרת זזה איתו
(() => {
  const v = document.getElementById('walk'), narrow = () => innerWidth/innerHeight < .9;
  const ready = () => document.body.classList.add('ready');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ ready(); return; }
  const tick = () => { if (narrow() && v.duration) v.style.objectPosition = (3 + 33*Math.min(1, v.currentTime/v.duration)).toFixed(1) + '% 30%'; if (!v.paused) requestAnimationFrame(tick); };
  v.addEventListener('play', () => requestAnimationFrame(tick));
  v.addEventListener('ended', () => { v.pause(); v.currentTime = Math.max(0, v.duration - .05); });
    v.play().catch(ready);
  setTimeout(ready, 900);
  if (narrow()) v.style.objectPosition = '3% 30%';
})();
</script>
